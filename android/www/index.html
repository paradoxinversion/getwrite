      static web assets it can copy into the native project, which doesn't
      map onto that standalone server output.

      Phase 0's goal is proving the storage/transport spike (search) against
      the real @capacitor/filesystem plugin on-device via a minimal harness,
      not shipping the full app UI in a WebView (that's Phase 2, per the
      spec's non-goals). This file is a trivial stand-in so
