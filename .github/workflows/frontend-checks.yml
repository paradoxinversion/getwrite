name: Frontend checks

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    hex-color-check:
        name: No hardcoded hex colors
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v2

            - name: Use Node.js 22
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              working-directory: frontend
              run: pnpm install --frozen-lockfile

            - name: Check for hardcoded hex color literals
              working-directory: frontend
              run: pnpm run check:no-hex

    markdown-format:
        name: Markdown formatting
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v2

            - name: Use Node.js 22
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            # Runs at the repository root, not in frontend/: prettier's scope is
            # the whole repo and .prettierignore lives at the root.
            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Check markdown formatting
              run: pnpm run format:check

    quality-gate:
        name: Typecheck, lint & tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v2

            - name: Use Node.js 22
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              working-directory: frontend
              run: pnpm install --frozen-lockfile

            - name: Typecheck
              working-directory: frontend
              run: pnpm typecheck

            - name: Lint
              working-directory: frontend
              run: pnpm lint

            - name: Build (production)
              working-directory: frontend
              run: pnpm build

            - name: Unit & integration tests
              working-directory: frontend
              run: pnpm test:ci
