name: Build Electron

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            tag:
                description: Release tag to build and upload artifacts for (e.g. getwrite-v0.2.13)
                required: true

permissions:
    contents: write

jobs:
    build:
        strategy:
            matrix:
                include:
                    # One macOS job builds BOTH architectures. There was a
                    # second, macos-13, for the Intel dmg — but macos-13 runners
                    # never picked the job up: it sat queued for 23h on the 1.8.0
                    # build, was cancelled at GitHub's 24h timeout on the one
                    # before, and was still queued when 2.0.0 shipped. Every
                    # release therefore sat "in progress" for a day, and its logs
                    # stayed unavailable until it was killed.
                    #
                    # It was also redundant. GetWrite-2.0.0-x64.dmg was published
                    # while macos-13 was still queued, and `lipo -info` on that
                    # artifact reports x86_64 for both the app binary and the
                    # Electron Framework — so this runner had already produced a
                    # genuine Intel build. Cross-building is safe here because
                    # electron-builder downloads the prebuilt x64 Electron and
                    # `npmRebuild: false` means nothing native is compiled.
                    #
                    # Both arches are named explicitly rather than relying on the
                    # arch list in electron-builder.yml winning over the CLI flag.
                    - os: macos-14
                      eb_args: --mac --x64 --arm64
                      artifact_glob: dist-electron/*.dmg
                    - os: windows-latest
                      eb_args: --win --x64
                      artifact_glob: dist-electron/*.exe
                    - os: ubuntu-latest
                      eb_args: --linux --x64
                      artifact_glob: dist-electron/*.AppImage

        runs-on: ${{ matrix.os }}

        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.release.tag_name || inputs.tag }}

            - name: Setup pnpm
              uses: pnpm/action-setup@v2

            - name: Use Node.js 22
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build frontend
              run: pnpm --filter getwrite-frontend build

            - name: Compile electron TypeScript
              run: pnpm --filter getwrite-electron build

            - name: Package with electron-builder
              shell: bash
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  cd electron
                  npx electron-builder ${{ matrix.eb_args }} --config electron-builder.yml -c.extraMetadata.version=$VERSION

            - name: Upload artifacts to release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh release upload ${{ github.event.release.tag_name || inputs.tag }} ${{ matrix.artifact_glob }} --clobber
