name: Build Android

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        name: Android package build health
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v2

            - name: Use Node.js 22
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build getwrite-android
              run: pnpm --filter getwrite-android build
